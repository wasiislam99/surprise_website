<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🎁 Open Your Gift</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&family=Great+Vibes&family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --gold: #D4AF37;
            --gold-light: #F5D76E;
            --gold-glow: rgba(212, 175, 55, 0.5);
            --pink: #FF6B9D;
            --dark: #0A050A;
            --rose: #FF1493;
            --rose-light: #FF6B9D;
            --purple: #6C3B6E;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(ellipse at 50% 50%, #1A0A1A 0%, #0A050A 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* ===== ANIMATED BACKGROUND ===== */
        .animated-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
        }
        .bg-gradient {
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at 30% 50%, rgba(108, 59, 110, 0.2) 0%, transparent 60%), radial-gradient(ellipse at 70% 50%, rgba(212, 175, 55, 0.05) 0%, transparent 60%), radial-gradient(ellipse at 50% 100%, rgba(255, 107, 157, 0.05) 0%, transparent 50%);
            animation: gradientShift 10s ease-in-out infinite;
        }
        @keyframes gradientShift { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }

        .bg-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.3;
            animation: orbFloat 8s ease-in-out infinite;
        }
        .orb1 { width: 400px; height: 400px; background: rgba(212, 175, 55, 0.1); top: -100px; right: -100px; }
        .orb2 { width: 300px; height: 300px; background: rgba(255, 107, 157, 0.08); bottom: -50px; left: -50px; animation-delay: 2s; }
        .orb3 { width: 200px; height: 200px; background: rgba(108, 59, 110, 0.1); top: 50%; left: 50%; transform: translate(-50%, -50%); animation-delay: 4s; }
        @keyframes orbFloat { 0%, 100% { transform: translate(0, 0) scale(1); } 33% { transform: translate(30px, -40px) scale(1.1); } 66% { transform: translate(-30px, 30px) scale(0.9); } }

        /* ===== LOVE RAIN ===== */
        .love-rain {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .love-rain .rain-drop {
            position: absolute;
            top: -20px;
            font-size: 18px;
            animation: rainFall linear infinite;
            opacity: 0.3;
        }
        @keyframes rainFall {
            0% { transform: translateY(0) rotate(0deg); opacity: 0.3; }
            100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
        }

        /* ===== FLOATING HEARTS ===== */
        .floating-hearts {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }
        .heart-particle {
            position: absolute;
            font-size: 20px;
            animation: floatHeartLinear linear infinite;
            opacity: 0.05;
        }
        @keyframes floatHeartLinear {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0.05; }
            100% { transform: translateY(-10vh) rotate(720deg); opacity: 0; }
        }

        /* ===== SPARKLES ===== */
        .sparkles-bg {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }
        .sparkle-dot {
            position: absolute;
            width: 3px;
            height: 3px;
            background: var(--gold);
            border-radius: 50%;
            animation: sparkleFloat linear infinite;
            opacity: 0;
            box-shadow: 0 0 6px var(--gold-glow);
        }
        @keyframes sparkleFloat {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 0.8; transform: scale(1.5); }
            90% { opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(0); opacity: 0; }
        }

        /* ===== MAIN ===== */
        .gift-page {
            width: 100%;
            max-width: 620px;
            padding: 20px;
            position: relative;
            z-index: 2;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .gift-container {
            width: 100%;
            animation: slideUp 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(50px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .lock-ring {
            display: flex;
            justify-content: center;
            gap: 14px;
            margin-bottom: 18px;
        }
        .ring-heart {
            font-size: 22px;
            animation: ringFloat 3s ease-in-out infinite;
            opacity: 0.5;
        }
        .ring-heart:nth-child(1) { animation-delay: 0s; }
        .ring-heart:nth-child(2) { animation-delay: 0.3s; }
        .ring-heart:nth-child(3) { animation-delay: 0.6s; }
        .ring-heart:nth-child(4) { animation-delay: 0.9s; }
        .ring-heart:nth-child(5) { animation-delay: 1.2s; }
        @keyframes ringFloat { 0%, 100% { transform: translateY(0) scale(1) rotate(0deg); } 50% { transform: translateY(-12px) scale(1.2) rotate(5deg); } }

        .gift-card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(50px);
            -webkit-backdrop-filter: blur(50px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 44px;
            padding: 44px 38px 38px;
            box-shadow: 0 40px 120px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            text-align: center;
            position: relative;
            overflow: hidden;
            animation: cardPulse 4s ease-in-out infinite;
        }
        @keyframes cardPulse { 0%, 100% { box-shadow: 0 40px 120px rgba(0, 0, 0, 0.7); } 50% { box-shadow: 0 40px 120px rgba(212, 175, 55, 0.1), 0 0 80px rgba(212, 175, 55, 0.05); } }

        .card-glow {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 20%, rgba(212, 175, 55, 0.04) 0%, transparent 70%);
            animation: cardGlow 20s linear infinite;
            pointer-events: none;
        }
        @keyframes cardGlow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .gift-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold), var(--pink), var(--gold), transparent);
            opacity: 0.3;
            animation: borderGlow 3s ease-in-out infinite;
        }
        @keyframes borderGlow { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.6; } }

        .gift-icon {
            font-size: 60px;
            display: block;
            margin-bottom: 14px;
            animation: iconBounce 2.5s ease-in-out infinite;
        }
        @keyframes iconBounce { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-10px) scale(1.1); } }

        .gift-title {
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            font-weight: 900;
            color: #FFFFFF;
            margin-bottom: 6px;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #FFFFFF 20%, var(--gold-light) 50%, var(--pink) 80%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-size: 200% 200%;
            animation: titleShimmer 4s ease-in-out infinite;
        }
        @keyframes titleShimmer { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }

        .gift-subtitle {
            color: rgba(255, 255, 255, 0.3);
            font-size: 13px;
            font-weight: 300;
            margin-bottom: 26px;
            letter-spacing: 3px;
        }

        /* ============================================
           PREMIUM GIFT BOX - Top Design
           ============================================ */
        .gift-box-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 10px 0 20px 0;
            cursor: pointer;
            position: relative;
            flex-direction: column;
            min-height: 260px;
            width: 100%;
            padding: 10px 0;
            transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .gift-box-container.fade-out {
            opacity: 0;
            transform: scale(0.3) rotateX(40deg);
            pointer-events: none;
            height: 0;
            min-height: 0;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        .gift-box-3d {
            position: relative;
            width: 210px;
            height: 210px;
            transform-style: preserve-3d;
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: boxFloat 3s ease-in-out infinite;
            margin: 0 auto;
        }

        .gift-box-3d.popup {
            animation: popEffect 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popEffect {
            0% { transform: scale(1) rotate(0deg); }
            30% { transform: scale(1.3) rotate(-5deg); }
            60% { transform: scale(0.9) rotate(3deg); }
            100% { transform: scale(1) rotate(0deg); }
        }

        @keyframes boxFloat {
            0%, 100% { transform: translateY(0) rotateX(0deg); }
            50% { transform: translateY(-12px) rotateX(3deg); }
        }

        .gift-box-3d:hover {
            transform: scale(1.06) rotateY(6deg);
        }

        /* Box Sides */
        .box-side {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 18px;
            backface-visibility: visible;
            border: 2px solid rgba(255, 215, 0, 0.12);
        }
        .box-side-front {
            transform: translateZ(105px);
            background: linear-gradient(145deg, #D4AF37, #F5D76E, #FFD700);
            box-shadow: inset 0 -10px 30px rgba(0, 0, 0, 0.15), inset 0 10px 30px rgba(255, 255, 255, 0.3);
        }
        .box-side-back {
            transform: rotateY(180deg) translateZ(105px);
            background: linear-gradient(145deg, #C8A82A, #D4AF37);
        }
        .box-side-left {
            transform: rotateY(-90deg) translateZ(105px);
            background: linear-gradient(145deg, #E8C84A, #D4AF37);
        }
        .box-side-right {
            transform: rotateY(90deg) translateZ(105px);
            background: linear-gradient(145deg, #D4AF37, #E8C84A);
        }
        .box-side-top {
            transform: rotateX(90deg) translateZ(105px);
            background: linear-gradient(145deg, #FFD700, #F5D76E, #D4AF37);
            box-shadow: inset 0 -10px 30px rgba(0, 0, 0, 0.1), inset 0 10px 30px rgba(255, 255, 255, 0.3);
        }
        .box-side-bottom {
            transform: rotateX(-90deg) translateZ(105px);
            background: linear-gradient(145deg, #B8960F, #C8A82A);
        }

        .box-side::after {
            content: '';
            position: absolute;
            inset: 10px;
            border-radius: 10px;
            border: 1px solid rgba(255, 215, 0, 0.06);
            pointer-events: none;
        }

        /* Lid */
        .box-lid {
            position: absolute;
            width: 100%;
            height: 52px;
            top: -52px;
            left: 0;
            transform-origin: bottom center;
            transform: rotateX(0deg);
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
            z-index: 10;
        }
        .box-lid .lid-side {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(145deg, #FFD700, #F5D76E, #D4AF37);
            border-radius: 18px 18px 0 0;
            box-shadow: inset 0 -10px 30px rgba(0, 0, 0, 0.1), inset 0 10px 30px rgba(255, 255, 255, 0.3);
            border: 2px solid rgba(255, 215, 0, 0.12);
            border-bottom: none;
        }
        .box-lid .lid-side::after {
            content: '';
            position: absolute;
            inset: 8px;
            border-radius: 10px 10px 0 0;
            border: 1px solid rgba(255, 215, 0, 0.06);
            pointer-events: none;
        }

        /* Ribbon */
        .box-lid .lid-ribbon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 18px;
            height: 100%;
            background: linear-gradient(180deg, #FF1493, #FF6B9D, #FF1493);
            border-radius: 4px;
            z-index: 2;
            box-shadow: 0 0 25px rgba(255, 20, 147, 0.3);
        }
        .box-lid .lid-ribbon-h {
            position: absolute;
            top: 50%;
            left: 0;
            transform: translateY(-50%);
            width: 100%;
            height: 18px;
            background: linear-gradient(90deg, #FF1493, #FF6B9D, #FF1493);
            z-index: 2;
            box-shadow: 0 0 25px rgba(255, 20, 147, 0.3);
        }
        .box-lid .lid-bow {
            position: absolute;
            top: -22px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 38px;
            z-index: 3;
            filter: drop-shadow(0 4px 20px rgba(0, 0, 0, 0.3));
            animation: bowBounce 2s ease-in-out infinite;
        }
        @keyframes bowBounce { 0%, 100% { transform: translateX(-50%) scale(1) rotate(0deg); } 50% { transform: translateX(-50%) scale(1.2) rotate(-6deg); } }

        /* Body Ribbons */
        .box-ribbon-vertical {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 18px;
            height: 100%;
            background: linear-gradient(180deg, #FF1493, #FF6B9D, #FF1493);
            z-index: 5;
            box-shadow: 0 0 30px rgba(255, 20, 147, 0.15);
        }
        .box-ribbon-horizontal {
            position: absolute;
            top: 50%;
            left: 0;
            transform: translateY(-50%);
            width: 100%;
            height: 18px;
            background: linear-gradient(90deg, #FF1493, #FF6B9D, #FF1493);
            z-index: 5;
            box-shadow: 0 0 30px rgba(255, 20, 147, 0.15);
        }

        /* Glow */
        .box-glow {
            position: absolute;
            inset: -30px;
            border-radius: 40px;
            background: radial-gradient(circle at 50% 50%, rgba(212, 175, 55, 0.25), transparent 70%);
            filter: blur(40px);
            z-index: -1;
            animation: glowPulse 3s ease-in-out infinite;
        }
        @keyframes glowPulse { 0%, 100% { opacity: 0.3; transform: scale(1); } 50% { opacity: 1; transform: scale(1.1); } }

        /* Sparkle Stars */
        .box-sparkle {
            position: absolute;
            inset: 0;
            z-index: 6;
            pointer-events: none;
            overflow: hidden;
            border-radius: 18px;
        }
        .box-sparkle .sparkle-star {
            position: absolute;
            font-size: 14px;
            animation: starFloat 4s ease-in-out infinite;
            opacity: 0.3;
        }
        .box-sparkle .sparkle-star:nth-child(1) { top: 10%; left: 15%; animation-delay: 0s; }
        .box-sparkle .sparkle-star:nth-child(2) { top: 20%; right: 20%; animation-delay: 1s; }
        .box-sparkle .sparkle-star:nth-child(3) { bottom: 25%; left: 25%; animation-delay: 2s; }
        .box-sparkle .sparkle-star:nth-child(4) { bottom: 15%; right: 15%; animation-delay: 0.5s; }
        .box-sparkle .sparkle-star:nth-child(5) { top: 45%; left: 5%; animation-delay: 1.5s; }
        .box-sparkle .sparkle-star:nth-child(6) { top: 40%; right: 5%; animation-delay: 2.5s; }

        @keyframes starFloat {
            0%, 100% { transform: translateY(0) scale(1) rotate(0deg); opacity: 0.2; }
            50% { transform: translateY(-15px) scale(1.5) rotate(180deg); opacity: 0.8; }
        }

        .click-hint {
            color: rgba(255, 255, 255, 0.15);
            font-size: 14px;
            margin-top: 10px;
            animation: pulseText 2s ease-in-out infinite;
            font-family: 'Inter', sans-serif;
        }
        @keyframes pulseText { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.8; } }

        /* ============================================
           LETTER - SINGLE MOVING ENVELOPE
           ============================================ */
        .letter-container {
            display: none;
            margin-top: 0;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(30px);
            border-radius: 24px;
            padding: 32px 28px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            animation: letterAppear 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            width: 100%;
            max-height: 500px;
            overflow-y: auto;
            text-align: center;
        }
        .letter-container::-webkit-scrollbar {
            width: 4px;
        }
        .letter-container::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 10px;
        }
        .letter-container::-webkit-scrollbar-thumb {
            background: var(--gold);
            border-radius: 10px;
        }
        .letter-container.show {
            display: block;
            animation: letterAppear 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes letterAppear {
            0% { opacity: 0; transform: scale(0.5) translateY(40px) rotateX(-10deg); }
            60% { transform: scale(1.03) rotateX(2deg); }
            100% { opacity: 1; transform: scale(1) translateY(0) rotateX(0deg); }
        }

        /* SINGLE MOVING ENVELOPE - Only 1 */
        .letter-container .moving-envelope {
            position: absolute;
            top: -22px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 42px;
            z-index: 10;
            filter: drop-shadow(0 4px 20px rgba(0, 0, 0, 0.3));
            animation: envelopeFloat 3s ease-in-out infinite;
            pointer-events: none;
        }
        @keyframes envelopeFloat {
            0%, 100% { transform: translateX(-50%) translateY(0) scale(1) rotate(0deg); }
            50% { transform: translateX(-50%) translateY(-12px) scale(1.1) rotate(-3deg); }
        }

        .letter-header {
            text-align: center;
            margin-bottom: 16px;
            margin-top: 10px;
        }
        .letter-header .letter-icon {
            font-size: 32px;
            display: block;
            margin-bottom: 4px;
            opacity: 0;
        }
        .letter-header h2 {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            font-weight: 700;
            color: #FFFFFF;
            background: linear-gradient(135deg, #D4AF37, #F5D76E);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .letter-header .letter-sub {
            font-family: 'Great Vibes', cursive;
            font-size: 22px;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 2px;
        }

        .letter-body {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 16px;
            padding: 20px 24px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            min-height: 100px;
            text-align: left;
            position: relative;
            max-width: 100%;
            margin: 0 auto;
        }

        .letter-body .letter-text {
            font-family: 'Playfair Display', serif;
            font-size: 17px;
            font-weight: 400;
            line-height: 2;
            color: rgba(255, 255, 255, 0.85);
            white-space: pre-wrap;
            word-wrap: break-word;
            text-align: left;
        }
        .letter-body .letter-text .cursor {
            display: inline-block;
            width: 2px;
            height: 20px;
            background: var(--gold);
            margin-left: 2px;
            animation: blink 0.8s step-end infinite;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        .letter-footer {
            margin-top: 18px;
            display: flex;
            justify-content: center;
        }
        .letter-footer .nav-btn {
            padding: 14px 44px;
            border: none;
            border-radius: 50px;
            background: linear-gradient(135deg, #D4AF37, #F5D76E);
            color: #0A050A;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
            box-shadow: 0 8px 30px rgba(212, 175, 55, 0.2);
        }
        .letter-footer .nav-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 40px rgba(212, 175, 55, 0.3);
        }

        #confettiContainer {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 9999;
            overflow: hidden;
        }
        .confetti-piece {
            position: absolute;
            top: -10px;
            animation: confettiFall linear forwards;
        }
        @keyframes confettiFall {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .gift-card { padding: 30px 20px 26px; border-radius: 32px; }
            .gift-title { font-size: 24px; }
            .gift-box-3d { width: 160px; height: 160px; }
            .box-side-front { transform: translateZ(80px); }
            .box-side-back { transform: rotateY(180deg) translateZ(80px); }
            .box-side-left { transform: rotateY(-90deg) translateZ(80px); }
            .box-side-right { transform: rotateY(90deg) translateZ(80px); }
            .box-side-top { transform: rotateX(90deg) translateZ(80px); }
            .box-side-bottom { transform: rotateX(-90deg) translateZ(80px); }
            .box-lid { height: 42px; top: -42px; }
            .box-lid .lid-bow { font-size: 30px; top: -18px; }
            .letter-container { padding: 24px 18px; max-height: 380px; }
            .letter-body { padding: 14px 16px; min-height: 80px; }
            .letter-body .letter-text { font-size: 15px; line-height: 1.8; }
            .letter-header h2 { font-size: 22px; }
            .letter-header .letter-sub { font-size: 18px; }
            .ring-heart { font-size: 16px; }
            .lock-ring { gap: 10px; }
            .letter-footer .nav-btn { padding: 12px 30px; font-size: 15px; }
            .letter-container .moving-envelope { font-size: 34px; top: -18px; }
        }

        @media (max-width: 380px) {
            .gift-box-3d { width: 130px; height: 130px; }
            .box-side-front { transform: translateZ(65px); }
            .box-side-back { transform: rotateY(180deg) translateZ(65px); }
            .box-side-left { transform: rotateY(-90deg) translateZ(65px); }
            .box-side-right { transform: rotateY(90deg) translateZ(65px); }
            .box-side-top { transform: rotateX(90deg) translateZ(65px); }
            .box-side-bottom { transform: rotateX(-90deg) translateZ(65px); }
            .box-lid { height: 35px; top: -35px; }
            .letter-container { max-height: 300px; }
            .letter-body .letter-text { font-size: 14px; }
        }
    </style>
</head>
<body>
    <!-- Love Rain Background -->
    <div class="love-rain" id="loveRain"></div>

    <!-- Floating Hearts -->
    <div class="floating-hearts" id="heartsContainer"></div>

    <!-- Sparkles -->
    <div class="sparkles-bg" id="sparklesBg"></div>

    <!-- Animated Background -->
    <div class="animated-bg">
        <div class="bg-gradient"></div>
        <div class="bg-orb orb1"></div>
        <div class="bg-orb orb2"></div>
        <div class="bg-orb orb3"></div>
    </div>

    <!-- Main -->
    <div class="gift-page">
        <div class="gift-container">
            <!-- Decorative Ring -->
            <div class="lock-ring">
                <span class="ring-heart">💕</span>
                <span class="ring-heart">❤️</span>
                <span class="ring-heart">💖</span>
                <span class="ring-heart">💗</span>
                <span class="ring-heart">💝</span>
            </div>

            <!-- Gift Card -->
            <div class="gift-card">
                <div class="card-glow"></div>
                <span class="gift-icon">🎁</span>
                <h1 class="gift-title">Er vitor shundor ekta gift ache</h1>
                <p class="gift-subtitle"> 💕</p>

                <!-- Premium Gift Box -->
                <div class="gift-box-container" id="giftBoxContainer">
                    <div class="gift-box-3d" id="giftBox3d" onclick="openGift()">
                        <div class="box-glow"></div>

                        <!-- Sparkles -->
                        <div class="box-sparkle">
                            <span class="sparkle-star">✨</span>
                            <span class="sparkle-star">✨</span>
                            <span class="sparkle-star">✨</span>
                            <span class="sparkle-star">✨</span>
                            <span class="sparkle-star">✨</span>
                            <span class="sparkle-star">✨</span>
                        </div>

                        <!-- Lid -->
                        <div class="box-lid" id="boxLid">
                            <div class="lid-side"></div>
                            <div class="lid-ribbon"></div>
                            <div class="lid-ribbon-h"></div>
                            <div class="lid-bow">🎀</div>
                        </div>

                        <!-- Box Sides -->
                        <div class="box-side box-side-front"></div>
                        <div class="box-side box-side-back"></div>
                        <div class="box-side box-side-left"></div>
                        <div class="box-side box-side-right"></div>
                        <div class="box-side box-side-top"></div>
                        <div class="box-side box-side-bottom"></div>

                        <!-- Ribbons -->
                        <div class="box-ribbon-vertical"></div>
                        <div class="box-ribbon-horizontal"></div>
                    </div>
                    <p class="click-hint" id="clickHint">👆 Giftbox e ekta click koro</p>
                </div>

                <!-- Letter - With Single Moving Envelope -->
                <div class="letter-container" id="letterContainer">
                    <!-- SINGLE MOVING ENVELOPE - Only 1 -->
                    <div class="moving-envelope"></div>

                    <div class="letter-header">
                        <span class="letter-icon">💌</span>
                        <h2>এই চিঠিটা মন দিয়ে পড়ো</h2>
                        <span class="letter-sub">~ তোমার ওয়াসির পক্ষ থেকে ~</span>
                    </div>
                    <div class="letter-body">
                        <div class="letter-text" id="letterText">
                            <span class="cursor"></span>
                        </div>
                    </div>
                    <div class="letter-footer">
                        <button class="nav-btn" id="nextBtn" onclick="goToDashboard()" style="display:none;">Go to Dashboard 🏠</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="confettiContainer"></div>

    <script src="js/giftbox.js"></script>
</body>
</html>
