<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🧩 Photo Puzzle</title>
    <link rel="stylesheet" href="style/main.css" />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&family=Great+Vibes&family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --gold: #D4AF37;
            --gold-light: #F5D76E;
            --gold-glow: rgba(212, 175, 55, 0.3);
            --pink: #FF6B9D;
            --dark: #0A050A;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(ellipse at 50% 50%, #1A0A1A 0%, #0A050A 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-y: auto;
            padding: 20px;
        }

        body::-webkit-scrollbar { width: 6px; }
        body::-webkit-scrollbar-track { background: var(--dark); }
        body::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 10px; }

        .animated-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
        }
        .bg-gradient {
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at 30% 50%, rgba(108, 59, 110, 0.15) 0%, transparent 60%), radial-gradient(ellipse at 70% 50%, rgba(212, 175, 55, 0.05) 0%, transparent 60%), radial-gradient(ellipse at 50% 100%, rgba(255, 107, 157, 0.05) 0%, transparent 50%);
            animation: gradientShift 10s ease-in-out infinite;
        }
        @keyframes gradientShift { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }

        .bg-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.3;
            animation: orbFloat 8s ease-in-out infinite;
        }
        .orb1 { width: 400px; height: 400px; background: rgba(212, 175, 55, 0.1); top: -100px; right: -100px; }
        .orb2 { width: 300px; height: 300px; background: rgba(255, 107, 157, 0.08); bottom: -50px; left: -50px; animation-delay: 2s; }
        .orb3 { width: 200px; height: 200px; background: rgba(108, 59, 110, 0.1); top: 50%; left: 50%; transform: translate(-50%, -50%); animation-delay: 4s; }
        @keyframes orbFloat { 0%, 100% { transform: translate(0, 0) scale(1); } 33% { transform: translate(30px, -40px) scale(1.1); } 66% { transform: translate(-30px, 30px) scale(0.9); } }

        .love-rain {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .love-rain .rain-drop {
            position: absolute;
            top: -20px;
            font-size: 16px;
            animation: rainFall linear infinite;
            opacity: 0.15;
        }
        @keyframes rainFall {
            0% { transform: translateY(0) rotate(0deg); opacity: 0.15; }
            100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
        }

        .floating-hearts {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }
        .heart-particle {
            position: absolute;
            font-size: 18px;
            animation: floatHeartLinear linear infinite;
            opacity: 0.04;
        }
        @keyframes floatHeartLinear {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0.04; }
            100% { transform: translateY(-10vh) rotate(720deg); opacity: 0; }
        }

        .sparkles-bg {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }
        .sparkle-dot {
            position: absolute;
            width: 3px;
            height: 3px;
            background: var(--gold);
            border-radius: 50%;
            animation: sparkleFloat linear infinite;
            opacity: 0;
            box-shadow: 0 0 6px var(--gold-glow);
        }
        @keyframes sparkleFloat {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 0.8; transform: scale(1.5); }
            90% { opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(0); opacity: 0; }
        }

        .puzzle-page {
            width: 100%;
            max-width: 720px;
            padding: 10px;
            position: relative;
            z-index: 2;
        }

        .puzzle-card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(50px);
            -webkit-backdrop-filter: blur(50px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 44px;
            padding: 44px 38px 38px;
            box-shadow: 0 40px 120px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            text-align: center;
            position: relative;
            overflow: visible;
            animation: slideUp 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(50px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .card-glow {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 20%, rgba(212, 175, 55, 0.04) 0%, transparent 70%);
            animation: cardGlow 20s linear infinite;
            pointer-events: none;
        }
        @keyframes cardGlow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .puzzle-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold), var(--pink), var(--gold), transparent);
            opacity: 0.3;
            animation: borderGlow 3s ease-in-out infinite;
        }
        @keyframes borderGlow { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.6; } }

        .puzzle-icon {
            font-size: 60px;
            display: block;
            margin-bottom: 10px;
            animation: iconBounce 2.5s ease-in-out infinite;
        }
        @keyframes iconBounce { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-10px) scale(1.1); } }

        .puzzle-title {
            font-family: 'Playfair Display', serif;
            font-size: 34px;
            font-weight: 900;
            color: #FFFFFF;
            margin-bottom: 4px;
            background: linear-gradient(135deg, #FFFFFF 20%, var(--gold-light) 50%, var(--pink) 80%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-size: 200% 200%;
            animation: titleShimmer 4s ease-in-out infinite;
        }
        @keyframes titleShimmer { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }

        .puzzle-subtitle {
            color: rgba(255, 255, 255, 0.3);
            font-size: 14px;
            font-weight: 300;
            margin-bottom: 24px;
            letter-spacing: 2px;
        }

        .puzzle-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
        }

        .puzzle-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            width: 100%;
            max-width: 400px;
            aspect-ratio: 1;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 16px;
            padding: 8px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .puzzle-piece {
            aspect-ratio: 1;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 700;
            color: #FFFFFF;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 2px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.04);
            position: relative;
            user-select: none;
            overflow: hidden;
        }

        .puzzle-piece img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .puzzle-piece .piece-number {
            position: absolute;
            top: 4px;
            right: 8px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.12);
            font-weight: 300;
        }

        .puzzle-piece:hover:not(.empty):not(.placed) {
            transform: scale(1.04);
            border-color: var(--gold);
            box-shadow: 0 4px 20px rgba(212, 175, 55, 0.15);
        }

        .puzzle-piece.empty {
            background: rgba(255, 255, 255, 0.02);
            border: 2px dashed rgba(255, 255, 255, 0.06);
            cursor: default;
        }

        .puzzle-piece.placed {
            border-color: #4CAF50;
            box-shadow: 0 0 20px rgba(76, 175, 80, 0.15);
            cursor: default;
        }

        .puzzle-piece .piece-emoji {
            font-size: 32px;
            opacity: 0.1;
        }

        .missing-pieces {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            min-height: 65px;
            width: 100%;
            max-width: 400px;
        }

        .missing-pieces .missing-label {
            width: 100%;
            color: rgba(255, 255, 255, 0.12);
            font-size: 11px;
            font-weight: 300;
            text-align: center;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .missing-piece {
            width: 55px;
            height: 55px;
            border-radius: 12px;
            border: 2px solid rgba(212, 175, 55, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 700;
            color: #FFFFFF;
            cursor: grab;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            background: rgba(212, 175, 55, 0.05);
            user-select: none;
            overflow: hidden;
        }

        .missing-piece img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .missing-piece:hover {
            transform: scale(1.1);
            border-color: var(--gold);
            box-shadow: 0 4px 20px rgba(212, 175, 55, 0.2);
        }

        .missing-piece:active {
            cursor: grabbing;
            transform: scale(0.95);
        }

        .missing-piece.placed {
            display: none;
        }

        .missing-piece .piece-emoji {
            font-size: 20px;
            opacity: 0.2;
        }

        .game-status {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 18px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            width: 100%;
            max-width: 400px;
        }

        .game-status span {
            color: rgba(255, 255, 255, 0.3);
            font-size: 13px;
            font-weight: 300;
        }

        .game-status .status-value {
            color: var(--gold);
            font-weight: 600;
        }

        .game-status .status-value.win {
            color: #4CAF50;
        }

        .win-message {
            display: none;
            padding: 14px;
            background: rgba(76, 175, 80, 0.05);
            border-radius: 16px;
            border: 1px solid rgba(76, 175, 80, 0.1);
            color: #4CAF50;
            font-size: 17px;
            font-weight: 600;
            animation: fadeInUp 0.5s ease;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .win-message.show { display: block; }
        .win-message .win-emoji { font-size: 36px; display: block; margin-bottom: 4px; }

        .puzzle-controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            max-width: 400px;
        }

        .puzzle-controls button {
            padding: 9px 20px;
            border: none;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
            background: rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.4);
        }

        .puzzle-controls button:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #FFFFFF;
        }

        .puzzle-controls button.primary {
            background: linear-gradient(135deg, #D4AF37, #F5D76E);
            color: #0A050A;
        }

        .puzzle-controls button.primary:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 30px rgba(212, 175, 55, 0.2);
        }

        .puzzle-footer {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .nav-btn {
            padding: 14px 36px;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
            text-decoration: none;
            display: inline-block;
        }

        .nav-btn.primary {
            background: linear-gradient(135deg, #D4AF37, #F5D76E);
            color: #0A050A;
            box-shadow: 0 8px 30px rgba(212, 175, 55, 0.2);
        }

        .nav-btn.primary:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 40px rgba(212, 175, 55, 0.3);
        }

        .nav-btn.secondary {
            background: rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.4);
        }

        .nav-btn.secondary:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #FFFFFF;
        }

        @media (max-width: 600px) {
            .puzzle-card { padding: 30px 20px 26px; border-radius: 32px; }
            .puzzle-title { font-size: 26px; }
            .puzzle-icon { font-size: 48px; }
            .puzzle-grid { max-width: 320px; gap: 4px; padding: 6px; }
            .missing-piece { width: 48px; height: 48px; }
            .missing-pieces { min-height: 55px; padding: 10px 12px; }
            .puzzle-controls button { padding: 7px 16px; font-size: 12px; }
            .nav-btn { padding: 12px 24px; font-size: 14px; }
        }

        @media (max-width: 400px) {
            .puzzle-grid { max-width: 260px; gap: 4px; padding: 4px; }
            .puzzle-piece { font-size: 18px; }
            .missing-piece { width: 40px; height: 40px; font-size: 14px; }
            .missing-pieces { gap: 6px; padding: 8px; }
        }

        #confettiContainer {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 9999;
            overflow: hidden;
        }
        .confetti-piece {
            position: absolute;
            top: -10px;
            animation: confettiFall linear forwards;
        }
        @keyframes confettiFall {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
        }
    </style>
</head>
<body>
    <!-- Love Rain -->
    <div class="love-rain" id="loveRain"></div>
    <div class="floating-hearts" id="heartsContainer"></div>
    <div class="sparkles-bg" id="sparklesBg"></div>
    <div class="animated-bg">
        <div class="bg-gradient"></div>
        <div class="bg-orb orb1"></div>
        <div class="bg-orb orb2"></div>
        <div class="bg-orb orb3"></div>
    </div>

    <div class="puzzle-page">
        <div class="puzzle-card">
            <div class="card-glow"></div>

            <span class="puzzle-icon">🧩</span>
            <h1 class="puzzle-title">Photo Puzzle</h1>
            <p class="puzzle-subtitle">🧩 Match the missing pieces to complete the puzzle!</p>

            <div class="puzzle-container">
                <div class="puzzle-grid" id="puzzleGrid"></div>

                <div class="missing-pieces" id="missingPieces">
                    <span class="missing-label">📦 Missing Pieces</span>
                </div>

                <div class="game-status">
                    <span>🧩 Pieces Placed</span>
                    <span class="status-value" id="placedCount">0 / 4</span>
                </div>

                <div class="win-message" id="winMessage">
                    <span class="win-emoji">🎉</span>
                    You completed the puzzle! 💕
                </div>

                <div class="puzzle-controls">
                    <button class="primary" onclick="resetGame()">🔄 New Game</button>
                    <button onclick="shufflePieces()">🎲 Shuffle</button>
                </div>
            </div>

            <div class="puzzle-footer">
                <a href="dashboard.html" class="nav-btn secondary">← Back</a>
                <a href="final.html" class="nav-btn primary">Next → 💎</a>
            </div>

        </div>
    </div>

    <div id="confettiContainer"></div>

    <script src="js/puzzle.js"></script>
</body>
</html>
